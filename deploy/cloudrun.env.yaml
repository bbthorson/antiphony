# Non-secret runtime environment for the Cloud Run `antiphony-core-api` service.
#
# This is the declarative half of what apphosting.yaml's `env:` block does, and
# it is the authoritative source for what production runs — the deploy workflow
# passes it via `--env-vars-file`, which REPLACES the service's entire non-secret
# environment on every deploy. A variable deleted here is deleted in production
# on the next deploy; a variable set by hand in the console is reverted by it.
# That is the intended behaviour (it is why the file exists) but it means the
# console is not a place to make a lasting change.
#
# Secrets are NOT here and cannot be. They are wired separately by the workflow's
# `--set-secrets`, which mounts Secret Manager versions as env vars:
#   ANTIPHONY_APP_TOKENS  <- antiphony-app-tokens
#   SYSTEM_AUTH_TOKEN     <- system-auth-token
#   ELEVENLABS_API_KEY    <- elevenlabs-api-key
# All three already exist in the antiphony-core project for App Hosting; the
# Cloud Run service account needs roles/secretmanager.secretAccessor on each.
#
# Values are carried over verbatim from apphosting.yaml. The per-variable
# rationale lives there and is not duplicated — read that file for WHY any of
# these are set. Only the deltas are annotated below.

# firebase-admin reads GCLOUD_PROJECT for the project id.
GCLOUD_PROJECT: "antiphony-core"
FIREBASE_STORAGE_BUCKET: "antiphony-core.firebasestorage.app"

NODE_ENV: "production"
LOG_LEVEL: "info"

# Turns ON the boot gate's host-match check: every pinned tenant DID must resolve
# to a did:web whose #atproto_pds endpoint points here, or the process refuses to
# start. Fail-closed, and it couples boot to each pinned domain being reachable.
#
# It must name the host callers actually reach the service on. Leave it as
# api.antiphony.dev and cut the domain over as the last migration step — pointing
# it at the *.run.app host would make the gate assert custody for a hostname that
# is not the published one.
ANTIPHONY_PDS_HOST: "api.antiphony.dev"

ANTIPHONY_APP_DIDS: "voxpop:did:web:did.voxpop.audio"

# ── Audio enrichment dispatch ─────────────────────────────────────────────────
# The Cloud Run service should be deployed in this same region. It is where the
# `antiphony-processing` queue lives, and a cross-region enqueue pays a round
# trip on every create.
ANTIPHONY_TASKS_LOCATION: "us-east4"
ANTIPHONY_TASKS_QUEUE: "antiphony-processing"

# The URL Cloud Tasks calls back with each job. Ordering-sensitive: while
# api.antiphony.dev still fronts App Hosting, tasks enqueued by Cloud Run are
# executed by the OLD service. Harmless — both run the same code against the same
# Firestore — but it means the ENQUEUE direction is not exercised until the
# cutover in deploy/README.md § 7, at which point this value becomes correct on
# its own. Leave it alone; it needs no edit at any point.
#
# The other direction (Cloud Tasks reaching the worker route on Cloud Run, and
# authenticating to it) IS tested, and independently of this value — see the
# `gcloud tasks create-http-task` probe in deploy/README.md § 6, which targets
# the service URL directly and mutates nothing.
ANTIPHONY_TASKS_WORKER_URL: "https://api.antiphony.dev/api/v1/system/process-audio"

# ALLOWED_ORIGINS is intentionally absent — core-api runs no CORS middleware at
# all. See the note atop apps/core-api/src/app.ts and the longer explanation in
# apphosting.yaml.
#
# ANTIPHONY_APP_WEBHOOK_URLS / _SECRETS are also intentionally absent: no
# receiver exists yet, so every tenant takes the silent opt-out and enrichment
# results travel by the pull path. Adding one without the other is a
# misconfiguration that logs at `error` and still sends nothing.
