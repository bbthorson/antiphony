# Non-secret runtime environment for the Cloud Run `antiphony-core-api` service.
#
# THE authoritative source for what production runs. The deploy workflow passes
# this via `--env-vars-file`, which REPLACES the service's entire non-secret
# environment on every deploy. A variable deleted here is deleted in production
# on the next deploy; a variable set by hand in the console is reverted by it.
# That is the intended behaviour (it is why the file exists) but it means the
# console is not a place to make a lasting change.
#
# Secrets are NOT here and cannot be. They are wired separately by the workflow's
# `--set-secrets`, which mounts Secret Manager versions as env vars:
#   ANTIPHONY_APP_TOKENS  <- antiphony-app-tokens
#   SYSTEM_AUTH_TOKEN     <- system-auth-token
#   ELEVENLABS_API_KEY    <- elevenlabs-api-key
# The Cloud Run runtime service account needs roles/secretmanager.secretAccessor
# on each. Their per-secret rationale is at the bottom of this file, since a
# reader asking "what does production run on" needs it and it lives nowhere else.
#
# This file previously deferred to apphosting.yaml for the per-variable rationale.
# That file is gone (App Hosting was retired at the Cloud Run cutover), so the
# reasoning was moved here rather than lost.

# firebase-admin reads GCLOUD_PROJECT for the project id. It also accepts
# FIREBASE_PROJECT_ID; only one is set, and this is it.
GCLOUD_PROJECT: "antiphony-core"

# Default Storage bucket, holding every audio blob. New Firebase projects
# provision a `<project>.firebasestorage.app` bucket rather than the older
# `<project>.appspot.com` — if Storage is ever re-provisioned, verify the exact
# name rather than assuming this pattern held.
FIREBASE_STORAGE_BUCKET: "antiphony-core.firebasestorage.app"

NODE_ENV: "production"
LOG_LEVEL: "info"

# How many proxy hops sit to the RIGHT of the client in `X-Forwarded-For`, i.e.
# how far in from the right lib/client-ip.ts must index to find the real caller.
# Get this wrong and rate limiting does not error — every caller silently shares
# one bucket.
#
# 1, because the edge is now Cloudflare -> Google frontend -> Cloud Run, which
# produces `<client-ip>, <cloudflare-egress-ip>`. Measured 2026-08-09 by probing
# the same anonymous route both ways: via api.antiphony.dev the chain is 2
# entries, direct to *.run.app it is 1, so Cloudflare contributes exactly one.
#
# It was UNSET before the Cloud Run cutover, taking the code default of 2 — right
# for App Hosting's 3-entry chain, wrong here. The `[rate-limit] client IP
# unresolvable` warn fired within minutes of the migration and is what caught it;
# if that warning ever reappears, this number is stale again. Re-measure, do not
# guess.
TRUSTED_PROXY_HOPS: "1"

# App-DID custody host (specs/atproto-authority-model.md). Turns ON the boot
# gate's host-match check: validateAllPins resolves each tenant's did:web at
# startup and REFUSES TO START unless its #atproto_pds endpoint points here
# (fail-closed). NOT secret. It also couples boot to each pinned domain being
# reachable — a did:web outage during a restart blocks boot, by design.
#
# It must name the host callers actually reach the service on, which is why it
# stayed api.antiphony.dev across the Cloud Run migration: pointing it at the
# *.run.app host would make the gate assert custody for a hostname that is not
# the published one.
ANTIPHONY_PDS_HOST: "api.antiphony.dev"

# Per-tenant app-DID pins: comma-separated `originAppId:did`. NOT secret — these
# are public DIDs. Must stay in sync with ANTIPHONY_APP_TOKENS (a tenant needs an
# entry in BOTH; boot warns on drift). Add bardcast here once its domain/did.json
# is live.
#
# `voxpop` moved off did:web:voxpop.audio (2026-07-12): the apex is now the
# handle of the Vox Pop *account* (did:plc:zp6xkzxo5uzgstgiy77iiz5j), so the app
# DID lives on its own subdomain rather than having one domain name two
# identities.
#
# Changing this value rewrites the authority of every post URI — stored
# StrongRefs must be migrated in lockstep, because parsePostId rejects any
# authority that is not the pinned app DID.
ANTIPHONY_APP_DIDS: "voxpop:did:web:did.voxpop.audio"

# ── Audio enrichment dispatch (specs/enrichment-pipeline-plan.md, step 8) ─────
# Without this block the dispatch seam resolves the NOOP dispatcher and both
# ElevenLabs stages settle `skipped` — every processing request sits `pending`
# forever. These three ANTIPHONY_TASKS_* vars are what `cloudTasksRequested()`
# keys on: set them together or not at all, since a partial set logs at `error`
# and still drops jobs. Project id is not repeated — the adapter falls back to
# GCLOUD_PROJECT above.
#
# Keep the Cloud Run service in this same region. It is where the
# `antiphony-processing` queue lives, and a cross-region enqueue pays a round
# trip on every create.
ANTIPHONY_TASKS_LOCATION: "us-east4"
ANTIPHONY_TASKS_QUEUE: "antiphony-processing"

# The absolute URL Cloud Tasks calls back with each job. Must resolve to THIS
# service and carry to the system-auth'd worker route.
#
# Both directions are now exercised in production. The Cloud Tasks → Cloud Run
# direction can be re-probed after any change to the runtime service account or
# the system token, without mutating anything — see the `gcloud tasks
# create-http-task` recipe in deploy/README.md § 6.
ANTIPHONY_TASKS_WORKER_URL: "https://api.antiphony.dev/api/v1/system/process-audio"

# ── Deliberately absent ───────────────────────────────────────────────────────
# ALLOWED_ORIGINS: core-api runs no CORS middleware at all (see the note atop
# apps/core-api/src/app.ts). Every caller is a service-token-holding backend, and
# the one browser-facing surface — the anonymous audio proxy — is reached by
# `<audio src=…>`, a no-cors load governed by Cross-Origin-Resource-Policy rather
# than CORS. The value this once held listed the API's OWN origins, which
# allowlisted nothing a browser would ever send.
#
# ANTIPHONY_APP_WEBHOOK_URLS / _SECRETS: deferred, not misconfigured. The spec
# makes the pull path permanent and the webhook a latency optimization over it,
# never a second source of truth (specs/enrichment-webhooks.md). The core side is
# built and tested; nothing is wired because NO RECEIVER EXISTS — Vox Pop's BFF
# has no verify-HMAC endpoint and runs enrichment pull-first from its own create
# seam plus a scheduled reconciliation sweep. (Confirmed against the Vox Pop
# repo, 2026-08-01.)
#
# To enable once a receiver is live — both, or neither. A tenant in exactly one
# is a misconfiguration that logs at `error` and still sends nothing. The url must
# be https off loopback and the secret ≥32 chars; either failing drops that tenant
# with an `error` log rather than downgrading. Create the secret BEFORE the
# workflow references it — a missing secret fails the deploy.
#
#   ANTIPHONY_APP_WEBHOOK_URLS: "voxpop:https://<bff-host>/api/v1/webhooks/antiphony"
#   ANTIPHONY_APP_WEBHOOK_SECRETS -> via --set-secrets, like the three above

# ANTIPHONY_ORIGIN_SECRET: NOT YET WIRED, and that is the safe state. The origin
# lock (middleware/origin-lock.ts) rejects any /api/v1/* request that did not
# arrive through Cloudflare carrying the `x-antiphony-origin` header. It is a
# no-op while the var is absent, which is why the code could ship before the
# Cloudflare side existed.
#
# Turning it on is ORDER-DEPENDENT — setting the secret before Cloudflare injects
# the header 403s every caller. See "Locking the origin to Cloudflare" in
# deploy/README.md. The short version:
#
#   1. Cloudflare Transform Rule injects `x-antiphony-origin: <value>`
#   2. Create the secret with that same value, grant the runtime SA access
#   3. Add `ANTIPHONY_ORIGIN_SECRET=antiphony-origin-secret:latest` to the
#      `--set-secrets` list in .github/workflows/deploy.yml AND set
#      ANTIPHONY_ORIGIN_LOCK_AUDIT below — audit mode runs the real comparison
#      and logs the verdict without refusing anything, which is the only way to
#      confirm the Transform Rule before it can 403 every caller
#   4. Remove the audit flag — enforcement begins, already verified
#
# Until step 3 the process logs `[origin-lock] ... lock is OPEN` once at first
# request. That line is the reminder, and its absence is the confirmation.
#
# ANTIPHONY_ORIGIN_LOCK_AUDIT: absent = enforcing. Set to "true" ONLY for the
# step-3 window and the same window during rotation; leaving it set means the
# lock evaluates and reports but never actually refuses anything. Only "true"
# or "1" enable it — any other value is off, so a typo cannot silently disable
# the lock.
#
# CURRENTLY ON — this is the step-3 window. The origin lock is evaluating every
# /api/v1/* request against the Cloudflare header and logging the verdict, but
# refusing nothing. REMOVE THIS LINE once the log reads `header present and
# matching`; that deploy is step 4 and begins enforcement. Until then the
# *.run.app URL is still reachable, which is the exposure this whole exercise
# is closing — so this is a window to pass through, not to camp in.
ANTIPHONY_ORIGIN_LOCK_AUDIT: "true"

# ── Why the three secrets are secret ──────────────────────────────────────────
# ANTIPHONY_APP_TOKENS  service-to-service app credentials (specs/service-auth.md):
#                       comma-separated `appId:token`, tokens ≥32 chars. Must stay
#                       in sync with ANTIPHONY_APP_DIDS above.
# SYSTEM_AUTH_TOKEN     the shared bearer EVERY `/system/*` route authenticates
#                       with — not just the Cloud Tasks worker — and that the
#                       enqueuing adapter bakes into each task's headers. ≥32
#                       chars; the middleware rejects anything shorter.
# ELEVENLABS_API_KEY    its PRESENCE alone selects the real Scribe/Voice Isolator
#                       providers. There is no separate enable flag: absent ⇒
#                       denoise and transcribe settle `skipped`.
