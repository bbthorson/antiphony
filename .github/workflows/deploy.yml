name: Deploy core-api

# Ships apps/core-api to Cloudflare Workers. This replaced the Cloud Run
# deployment, which had itself replaced a Firebase App Hosting git trigger.
# Both are history: nothing in this repo talks to Google Cloud or Firebase now.
#
# ── Why this is so much shorter than the Cloud Run version ────────────────────
# That workflow built a container, deployed it with NO traffic, smoke-tested it
# on its own tagged URL, and only then promoted it. All of that existed for one
# reason, stated in its own header: core-api booted fail-closed, resolving every
# tenant's did:web over the network and calling `process.exit(1)` if custody
# could not be proven — so a deploy could fail for a reason that had nothing to
# do with the commit, and the apparatus was there to contain that.
#
# Workers have no boot phase, and the replacement gate is per-tenant and on the
# request path (middleware/auth.ts). What is left of the deploy-time half is the
# `validate:pins` step below, which proves the same thing BEFORE anything ships
# rather than after. So the sequence collapses to: prove the pins, deploy.
#
# See specs/cloudflare-migration.md § The boot gate.
#
# ── One-time setup ────────────────────────────────────────────────────────────
# Resources named in apps/core-api/wrangler.jsonc must exist first, and their
# ids replace the placeholders in that file:
#
#     npx wrangler hyperdrive create antiphony-neon --connection-string "$DATABASE_URL"
#     npx wrangler kv namespace create PIN_CACHE
#     npx wrangler queues create antiphony-processing
#     npx wrangler queues create antiphony-processing-dlq
#
# Then the secrets, which never appear in any committed file:
#
#     npx wrangler secret put SYSTEM_AUTH_TOKEN     -c apps/core-api/wrangler.jsonc
#     npx wrangler secret put ANTIPHONY_APP_TOKENS  -c apps/core-api/wrangler.jsonc
#     npx wrangler secret put ELEVENLABS_API_KEY    -c apps/core-api/wrangler.jsonc
#
# `CLOUDFLARE_API_TOKEN` is a repo secret with Workers Scripts:Edit, and
# `CLOUDFLARE_ACCOUNT_ID` a repo variable (an identifier, not a credential).

# ── Why `workflow_run` and not `push` ─────────────────────────────────────────
# This used to run on `push` to master, which put it in a RACE with CI rather
# than after it. Both start on the same commit, and nothing connects them — so a
# commit whose tests fail still deploys, and usually wins, because this workflow
# is much shorter than CI. The gate that was supposed to protect production ran
# beside it instead of in front of it.
#
# Chaining off CI's completion is what makes "a red CI cannot ship" true. The
# `if:` on the job below is the other half: `workflow_run` fires on completion
# whatever the outcome, so the conclusion has to be checked, not assumed.
#
# ── The path filter is gone, deliberately ────────────────────────────────────
# `workflow_run` has no `paths`, and the filter is not worth reconstructing. Its
# own comment already named the failure it caused as the worse one: a change to
# something load-bearing but unlisted would NOT deploy, and the tree would
# silently diverge from the running Worker. Deploying on every green master
# commit removes that class entirely, and costs a redundant deploy of an
# identical bundle after a docs-only change — which is not free of value either,
# since the smoke test below asserts `/health` reports the commit master is on.
on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-core-api
    cancel-in-progress: false

jobs:
    deploy:
        name: prove pins · deploy
        runs-on: ubuntu-latest
        # `workflow_dispatch` carries no `workflow_run` context, so it falls
        # through on the empty-string comparison.
        if: >-
            github.event_name == 'workflow_dispatch' ||
            github.event.workflow_run.conclusion == 'success'
        env:
            # The commit CI actually ran on, used for the checkout, the
            # COMMIT_SHA var, and the smoke-test assertion — so all three name
            # the same thing.
            #
            # NOT `github.sha`. On a `workflow_run` event that is the tip of the
            # default branch when THIS run was queued, which is a different
            # commit as soon as anything merges while CI is in flight. Deploying
            # `github.sha` would ship a tree CI never saw, and the smoke test
            # would then assert the wrong SHA and fail a deploy that worked.
            DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci

            # Mechanism 1 of the boot-gate replacement (specs/cloudflare-
            # migration.md § The boot gate). Proves every app-DID pin in
            # apps/core-api/wrangler.jsonc — the same file this deploy applies —
            # before anything ships.
            #
            # It does NOT replace the runtime check. Deploy-time correctness and
            # ongoing custody are different properties: this one is about the
            # pins in this commit, and ongoing custody is the per-request gate
            # plus the hourly drift cron.
            - name: Prove app-DID pins
              run: npm run validate:pins -w @antiphony/core-api

            # The Worker bundle is decided by the whole transitive import graph
            # of the app, not by anything visible in worker.ts, so a Node-only
            # dependency can arrive via an ordinary-looking import in a
            # middleware file. `wrangler deploy` would ship it without
            # complaint. CI runs this on every PR too; running it here as well
            # is cheap and this is the step that actually matters.
            - name: Assert the Worker bundle carries no Node-only dependency
              run: npm run check:worker-bundle -w @antiphony/core-api

            - name: Deploy
              # Through the workspace script, so wrangler resolves from the
              # workspace that declares it and picks up its wrangler.jsonc by
              # sitting in the same directory.
              #
              # COMMIT_SHA is passed as a var rather than baked into the bundle.
              # It used to be an esbuild `define`, and that went with the Node
              # bundle — but `/health` still reports it, and "which commit is
              # this deployment running" is exactly the question a migration
              # makes hard to answer from the tree alone.
              run: |
                  npm run deploy -w @antiphony/core-api -- \
                    --var "COMMIT_SHA:${DEPLOY_SHA}" \
                    --var "BUILD_TIME:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

            - name: Smoke test
              run: |
                  # Asserts the SHA, not `"ok":true`.
                  #
                  # `ok:true` is true of ANY healthy deployment at this hostname,
                  # including one this workflow did not produce — so it passed
                  # while `api.antiphony.dev` still answered from Cloud Run, and
                  # would pass again on any stale Worker version. A smoke test
                  # that cannot fail is worse than none, because it is read as
                  # evidence. The sibling failure is already recorded: a `Deploy`
                  # failure SKIPPED this step for 17 hours, so the one step whose
                  # job is to say "live is not what you merged" never ran.
                  #
                  # `/health` reports `sha` from the COMMIT_SHA var set above, so
                  # matching it against DEPLOY_SHA proves THIS deploy is the one
                  # serving. It also still prints `backend` and the data-presence
                  # fields, which is what the log is worth reading for now that
                  # `backend` has only one possible value.
                  for attempt in 1 2 3 4 5; do
                    if BODY="$(curl -fsS --max-time 10 https://api.antiphony.dev/health)"; then
                      echo "$BODY"
                      echo "$BODY" | grep -q "\"sha\":\"${DEPLOY_SHA}\"" && exit 0
                    fi
                    echo "attempt ${attempt} failed; retrying"
                    sleep 5
                  done
                  echo "::error::/health at api.antiphony.dev is not serving ${DEPLOY_SHA}."
                  echo "::error::If the domain route is not attached to the antiphony-core-api Worker yet, this failure is CORRECT and expected — the deploy succeeded, the hostname just still points elsewhere. Attach it (Workers & Pages -> antiphony-core-api -> Settings -> Domains & Routes), then re-run this workflow."
                  exit 1
