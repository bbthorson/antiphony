name: Deploy core-api

# Ships apps/core-api to Cloudflare Workers. This replaced the Cloud Run
# deployment, which had itself replaced a Firebase App Hosting git trigger.
# Both are history: nothing in this repo talks to Google Cloud or Firebase now.
#
# ── Why this is so much shorter than the Cloud Run version ────────────────────
# That workflow built a container, deployed it with NO traffic, smoke-tested it
# on its own tagged URL, and only then promoted it. All of that existed for one
# reason, stated in its own header: core-api booted fail-closed, resolving every
# tenant's did:web over the network and calling `process.exit(1)` if custody
# could not be proven — so a deploy could fail for a reason that had nothing to
# do with the commit, and the apparatus was there to contain that.
#
# Workers have no boot phase, and the replacement gate is per-tenant and on the
# request path (middleware/auth.ts). What is left of the deploy-time half is the
# `validate:pins` step below, which proves the same thing BEFORE anything ships
# rather than after. So the sequence collapses to: prove the pins, deploy.
#
# See specs/archive/cloudflare-migration.md § The boot gate.
#
# ── One-time setup ────────────────────────────────────────────────────────────
# Resources named in apps/core-api/wrangler.jsonc must exist first, and their
# ids replace the placeholders in that file:
#
#     npx wrangler kv namespace create PIN_CACHE
#     npx wrangler queues create antiphony-processing
#     npx wrangler queues create antiphony-processing-dlq
#
# Then the secrets, which never appear in any committed file:
#
#     npx wrangler secret put DATABASE_URL          -c apps/core-api/wrangler.jsonc
#     npx wrangler secret put SYSTEM_AUTH_TOKEN     -c apps/core-api/wrangler.jsonc
#     npx wrangler secret put ANTIPHONY_APP_TOKENS  -c apps/core-api/wrangler.jsonc
#     npx wrangler secret put ELEVENLABS_API_KEY    -c apps/core-api/wrangler.jsonc
#
# ⚠️ DO NOT CREATE A HYPERDRIVE, AND DO NOT BIND ONE.
# This block used to open with `wrangler hyperdrive create antiphony-neon`,
# which contradicted the decision recorded at length in
# apps/core-api/wrangler.jsonc § "A DATABASE_URL secret, not Hyperdrive" — and
# contradicted it in the dangerous direction, because this file is what someone
# setting the deploy up from scratch reads first.
#
# The database is a plain `DATABASE_URL` secret (added above) precisely because
# `adapters/outbound/postgres/client.ts` runs `@neondatabase/serverless` in HTTP
# mode, which derives its HTTPS endpoint from the connection string's HOSTNAME.
# A Hyperdrive string points into Cloudflare's network rather than at Neon, so
# binding one with this driver does not degrade the database — it breaks it
# outright. And `readRuntimeEnv` PREFERS Hyperdrive whenever it is bound, so the
# breakage is invisible in config review and total at runtime.
#
# Hyperdrive becomes the right answer only after the driver is replaced with one
# that speaks the Postgres wire protocol. That is a code change, not a binding.
#
# `CLOUDFLARE_API_TOKEN` is a repo secret with Workers Scripts:Edit, and
# `CLOUDFLARE_ACCOUNT_ID` a repo variable (an identifier, not a credential).

# ── Why `workflow_run` and not `push` ─────────────────────────────────────────
# This used to run on `push` to master, which put it in a RACE with CI rather
# than after it. Both start on the same commit, and nothing connects them — so a
# commit whose tests fail still deploys, and usually wins, because this workflow
# is much shorter than CI. The gate that was supposed to protect production ran
# beside it instead of in front of it.
#
# Chaining off CI's completion is what makes "a red CI cannot ship" true. The
# `if:` on the job below is the other half: `workflow_run` fires on completion
# whatever the outcome, so the conclusion has to be checked, not assumed.
#
# ── The path filter is gone, deliberately — and core-api is now the ONLY ─────
# ── deploy here without one, which is also deliberate ────────────────────────
#
# `deploy-docs.yml` and `deploy-audio-rendition.yml` both gained a `changes`
# job. This one did not, and the asymmetry is an argument rather than an
# oversight:
#
#   - audio-rendition BUILDS AND PUSHES A CONTAINER. Minutes of work plus a
#     registry write to produce a byte-identical image after a docs-only merge.
#     Its inputs are checkable rather than assumed: the Dockerfile copies the
#     root manifests and `apps/audio-rendition` and nothing else, so the filter
#     is provably complete.
#   - docs builds an Astro site, and its inputs are also findable — the build
#     script names the one file it reads from another app.
#   - core-api is a bundle-and-upload: the cheapest deploy in the repo. And what
#     a redundant run buys here is real, because the smoke test re-asserts that
#     `/health` reports the commit master is actually on.
#
# So the trade differs by workflow, and the original reasoning still stands for
# this one: a change to something load-bearing but unlisted would NOT deploy,
# and the tree would silently diverge from the running Worker. Where the cost of
# that class is one redundant upload, pay it.
#
# ── The original note ────────────────────────────────────────────────────────
# `workflow_run` has no `paths`, and the filter is not worth reconstructing. Its
# own comment already named the failure it caused as the worse one: a change to
# something load-bearing but unlisted would NOT deploy, and the tree would
# silently diverge from the running Worker. Deploying on every green master
# commit removes that class entirely, and costs a redundant deploy of an
# identical bundle after a docs-only change — which is not free of value either,
# since the smoke test below asserts `/health` reports the commit master is on.
on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-core-api
    cancel-in-progress: false

jobs:
    deploy:
        name: prove pins · deploy
        runs-on: ubuntu-latest
        # Recorded as a deployment against the `production` environment, so
        # "what is live and since when" is answerable from the repo rather than from
        # a provider console. Deliberately carries NO protection rules: a required
        # reviewer here would pause a deploy waiting on the only person who could
        # approve it. It exists for the history, and as the scope that holds
        # environment-level secrets.
        environment:
            name: production
            url: https://api.antiphony.dev
        # `workflow_dispatch` carries no `workflow_run` context, so it falls
        # through on the empty-string comparison.
        if: >-
            github.event_name == 'workflow_dispatch' ||
            github.event.workflow_run.conclusion == 'success'
        env:
            # The commit CI actually ran on, used for the checkout, the
            # COMMIT_SHA var, and the smoke-test assertion — so all three name
            # the same thing.
            #
            # NOT `github.sha`. On a `workflow_run` event that is the tip of the
            # default branch when THIS run was queued, which is a different
            # commit as soon as anything merges while CI is in flight. Deploying
            # `github.sha` would ship a tree CI never saw, and the smoke test
            # would then assert the wrong SHA and fail a deploy that worked.
            DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}

            - uses: ./.github/actions/setup-node

            - run: npm ci

            # Mechanism 1 of the boot-gate replacement (specs/cloudflare-
            # migration.md § The boot gate). Proves every app-DID pin in
            # apps/core-api/wrangler.jsonc — the same file this deploy applies —
            # before anything ships.
            #
            # It does NOT replace the runtime check. Deploy-time correctness and
            # ongoing custody are different properties: this one is about the
            # pins in this commit, and ongoing custody is the per-request gate
            # plus the hourly drift cron.
            - name: Prove app-DID pins
              run: npm run validate:pins -w @antiphony/core-api

            # The Worker bundle is decided by the whole transitive import graph
            # of the app, not by anything visible in worker.ts, so a Node-only
            # dependency can arrive via an ordinary-looking import in a
            # middleware file. `wrangler deploy` would ship it without
            # complaint. CI runs this on every PR too; running it here as well
            # is cheap and this is the step that actually matters.
            - name: Assert the Worker bundle carries no Node-only dependency
              run: npm run check:worker-bundle -w @antiphony/core-api

            # The build time as a step OUTPUT rather than inline in the deploy
            # command, so the smoke test below can assert the exact value this
            # run stamped. Inline, nothing downstream could see it — which is
            # why the smoke test could only ever check the sha.
            - name: Stamp the build time
              id: stamp
              run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

            - name: Deploy
              # Through the workspace script, so wrangler resolves from the
              # workspace that declares it and picks up its wrangler.jsonc by
              # sitting in the same directory.
              #
              # COMMIT_SHA is passed as a var rather than baked into the bundle.
              # It used to be an esbuild `define`, and that went with the Node
              # bundle — but `/health` still reports it, and "which commit is
              # this deployment running" is exactly the question a migration
              # makes hard to answer from the tree alone.
              run: |
                  npm run deploy -w @antiphony/core-api -- \
                    --var "COMMIT_SHA:${DEPLOY_SHA}" \
                    --var "BUILD_TIME:${{ steps.stamp.outputs.time }}"
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

            - name: Smoke test
              env:
                  # DEPLOY_SHA is already job-level env, so the shell reads it
                  # directly; only the stamp needs passing in.
                  EXPECT_BUILD_TIME: ${{ steps.stamp.outputs.time }}
                  HEALTH_URL: https://api.antiphony.dev/health
              run: |
                  # Asserts the SHA and the build time, not `"ok":true`.
                  #
                  # `ok:true` is true of ANY healthy deployment at this hostname,
                  # including one this workflow did not produce — so it passed
                  # while `api.antiphony.dev` still answered from Cloud Run, and
                  # would pass again on any stale Worker version. A smoke test
                  # that cannot fail is worse than none, because it is read as
                  # evidence. The sibling failure is already recorded: a `Deploy`
                  # failure SKIPPED this step for 17 hours, so the one step whose
                  # job is to say "live is not what you merged" never ran.
                  #
                  # ── Why the SHA is not enough on its own ──────────────────────
                  # `sha` proves the live Worker was built from this commit. It
                  # does NOT prove THIS RUN deployed it: re-run this workflow on
                  # a commit already live and the check passes instantly,
                  # satisfied by the PREVIOUS deploy — so a re-run whose upload
                  # silently did nothing reports success. That is the blind spot
                  # the runbook names, and a manual re-run is exactly when a
                  # false green costs most.
                  #
                  # `deployedAt` closes it: it comes from the BUILD_TIME var
                  # stamped seconds ago, so matching it proves the live version
                  # is the one this run uploaded rather than merely one carrying
                  # the same commit. Matched EXACTLY rather than "at or after" —
                  # the concurrency group serialises deploys, so a NEWER
                  # deployedAt would mean something shipped underneath us, which
                  # is worth failing on.
                  #
                  # ── Why the window is two minutes and not twenty-five seconds ─
                  # This polled 5 times at 5s. A wrangler deploy returns when the
                  # upload is accepted; Custom Domain routing catches up
                  # separately, and in the Vox Pop repo it had NOT caught up by
                  # second five on 2026-09-04 — that run failed red on a deploy
                  # that had in fact succeeded. Both repos now use the same
                  # 20 x 6s window, so they no longer disagree about how long
                  # propagation is allowed to take.
                  for attempt in $(seq 1 20); do
                    BODY="$(curl -fsS --max-time 10 "$HEALTH_URL" || true)"
                    echo "attempt ${attempt}: ${BODY}"
                    if printf '%s' "$BODY" | grep -q "\"sha\":\"${DEPLOY_SHA}\"" \
                       && printf '%s' "$BODY" | grep -q "\"deployedAt\":\"${EXPECT_BUILD_TIME}\""; then
                      echo "live Worker is ${DEPLOY_SHA}, deployed at ${EXPECT_BUILD_TIME} by this run"

                      # ── The processing toggles, from the pre-launch audit ─────
                      # HARD failures, unchanged from what the audit added, and
                      # deliberately inside the success branch: they are only
                      # meaningful once we know this is our deploy. A production
                      # Worker running stubbed or inline processing is broken in
                      # a way `/health` will happily report as `ok:true`.
                      printf '%s' "$BODY" | grep -q '"stubProcessing":false' \
                        || { echo "::error::stubProcessing is true in production"; exit 1; }
                      printf '%s' "$BODY" | grep -q '"inlineProcessing":false' \
                        || { echo "::error::inlineProcessing is true in production"; exit 1; }

                      # ── A WARNING, deliberately not a failure ────────────────
                      # `/health` also reports whether the records and blobs
                      # backends answered a presence probe. Unlike the toggles
                      # above, those are NOT part of the deploy's correctness: a
                      # probe can time out on a cold Neon branch while the deploy
                      # is perfectly good, so failing on it would make this step
                      # flaky and teach someone to re-run it without reading it —
                      # the failure mode this step exists to avoid.
                      #
                      # But passing in silence is how `records: unavailable`
                      # went unnoticed while a green deploy sat on top of it.
                      # So: say something, loudly enough to appear in the run
                      # summary, and keep going.
                      for field in records blobs; do
                        if ! printf '%s' "$BODY" | grep -q "\"${field}\":\"present\""; then
                          echo "::warning::/health reports ${field} not present — the deploy is fine, but the ${field} backend did not answer its presence probe. Worth a look if it persists."
                        fi
                      done
                      exit 0
                    fi
                    sleep 6
                  done
                  echo "::error::/health at api.antiphony.dev is not serving sha=${DEPLOY_SHA} deployedAt=${EXPECT_BUILD_TIME} after 2 minutes."
                  echo "::error::If sha matches but deployedAt does not, the live version is an EARLIER deploy of this same commit — this run's upload did not take."
                  echo "::error::If the domain route is not attached to the antiphony-core-api Worker yet, this failure is CORRECT and expected — the deploy succeeded, the hostname just still points elsewhere. Attach it (Workers & Pages -> antiphony-core-api -> Settings -> Domains & Routes), then re-run this workflow."
                  exit 1
