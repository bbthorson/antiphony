name: CI

# Every check here already exists as an npm script — this workflow only makes
# them mandatory. Until now nothing gated a merge, so `typecheck`, `lint`,
# `test`, and the generated-OpenAPI drift check were all opt-in.

# ⚠️ THE IGNORE LIST IS NARROW ON PURPOSE — DO NOT WIDEN IT TO `**/*.md`.
#
# `apps/docs/src/content/docs/**` is ELEVEN markdown/mdx files that ARE the
# documentation site's content, and `deploy-docs.yml` is triggered by
# `workflow_run` off THIS workflow. A blanket `**/*.md` ignore would therefore
# mean: edit a docs page, CI is skipped, no `workflow_run` fires, and the docs
# site never deploys — a prose change that silently fails to publish, which is
# strictly worse than paying two minutes of CI for it.
#
# So only the locations that are prose AND are read by nothing are listed:
# `specs/**` (16 files, all design records), and the two root documents.
# Verified before writing this: nothing under apps/ or packages/ reads either
# path at build, test, or release time, and `release.yml` derives the version
# from `packages/shared/package.json` rather than from CHANGELOG.md.
#
# The payoff is deliberately modest. Over the last 25 first-parent merges here
# exactly ONE was markdown-only, so this saves roughly 4% of merge runs — not
# the ~24% the same filter saves in the Vox Pop repo, where every deployed app's
# content is TypeScript and the blunt `**/*.md` form is safe. Copying that
# filter across without checking would have broken the docs deploy.
#
# `paths-ignore` skips a run only when EVERY changed file matches, so a commit
# touching code and specs together still runs the full suite.
on:
  pull_request:
    paths-ignore:
      - 'specs/**'
      - 'README.md'
      - 'CHANGELOG.md'
  push:
    branches: [master]
    paths-ignore:
      - 'specs/**'
      - 'README.md'
      - 'CHANGELOG.md'

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest

    # A hung job bills until GitHub kills it, and the DEFAULT ceiling is 360
    # minutes — six hours of billable time for a run that stopped making
    # progress in the first two. The concurrency group above does not cover
    # this: it supersedes runs a newer push made obsolete, never a run that
    # simply fails to finish.
    #
    # Not hypothetical for this workflow. It shells out to the npm registry
    # twice — once for `npm install --global npm@…`, once for `npm ci` — and a
    # registry stall hangs rather than fails.
    #
    # 15 against a ~2-minute median is a ceiling on pathology, not a budget to
    # fit inside. If a legitimate run ever approaches it, raise it; do not
    # remove it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-node

      # `npm ci` at the root installs every workspace; core-api depends on
      # @antiphony/core + @antiphony/shared through npm workspaces.
      #
      # It also BUILDS @antiphony/shared, via that package's `prepare` script.
      # That is load-bearing for the typecheck below, not incidental: every
      # export of @antiphony/shared resolves into its dist/, and apps/reference
      # imports those subpaths directly, so a tree without dist/ cannot be
      # typechecked. Don't drop `prepare` without reordering these steps.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test

      # Builds @antiphony/shared (dual ESM/CJS) then bundles core-api and
      # regenerates the OpenAPI documents. Needs no secrets and touches no
      # network, which is what makes the drift check below safe to run here.
      - run: npm run build

      # `gen:openapi` writes two TRACKED files. If a route change lands without
      # a rebuild, the committed contract silently lags the code — so assert the
      # build produced no diff rather than trusting the author to remember.
      - name: Assert the generated OpenAPI is committed
        run: |
          git diff --exit-code -- \
            apps/core-api/openapi.json \
            apps/core-api/openapi.surface.json

      # Bundles the Workers entry and fails if a Node-only dependency is in it.
      # Nothing above catches that: `tsc` is happy, the tests are happy, and
      # `wrangler deploy` bundles a CommonJS SDK with native transitive deps
      # without complaint, then ships a Worker that dies on its first request.
      # That is not hypothetical — it is what firebase-admin did here, and the
      # denylist in the script still names it. Needs no Cloudflare credentials —
      # it is `--dry-run` — which is what makes it safe to run on a PR.
      - run: npm run check:worker-bundle -w @antiphony/core-api

      # audio-rendition is the one deployable that is a container, and the image
      # is where its real preconditions live — none of which anything above
      # touches. `npm run build` compiles its TypeScript in the host's tree; it
      # does not exercise the pinned npm, the repo-root build context the
      # workspace install needs, or the `ffmpeg -version` assert in the runtime
      # stage. That assert is the load-bearing one: the service spawns a bare
      # `ffmpeg` off PATH and nothing in package.json declares one, so the image
      # is the only place that dependency is checked at all.
      #
      # Same invocation as .github/workflows/deploy-audio-rendition.yml, minus
      # the push and the registry tag — it builds and discards, so it needs no
      # GCP credentials and is safe on a PR from a fork.
      #
      # Without this, the first build of the Dockerfile ever is on master,
      # inside the workflow that then runs `gcloud run deploy` — so a broken
      # image is found after merge, on the deploy path, rather than here.
      - name: Build the audio-rendition image
        run: docker build -f apps/audio-rendition/Dockerfile .

      # The docs site ships from `deploy-docs.yml`, which now CHAINS off this
      # workflow rather than running in Cloudflare's dashboard — so this step is
      # the gate on it, not merely an early warning. `copy-openapi.mjs --strict`
      # also fails the build if core-api's spec is missing, tying the published
      # docs to the contract built above.
      #
      # All three deploy workflows are downstream of this one. A failure here
      # stops every one of them, which is the property the `workflow_run`
      # trigger buys and `push` did not.
      #
      # There used to be a step after this one asserting no diff on
      # apps/docs/public/openapi.json. It could never fail: that path is
      # gitignored (apps/docs/.gitignore) and untracked, so `git diff` over it
      # is always empty. The drift it read as guarding against is covered for
      # real by the two steps around it — the assert above is on TRACKED files,
      # and `--strict` here fails the build if that source is missing. The docs
      # copy is a build artifact derived from it, regenerated on every build
      # including Cloudflare's, which runs this same command.
      - run: npm run build -w @antiphony/docs
