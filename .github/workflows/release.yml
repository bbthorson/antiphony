name: Release

# Publishes @antiphony/shared to npm. It is the only publishable package in the
# workspace — every other workspace is `private` or deployed elsewhere (core-api
# and docs both to Cloudflare Workers).
#
# Why this exists: publishing used to be manual, and so it didn't happen. 0.5.0
# was bumped in the tree in fe7596b and then sat unpublished while the registry
# served 0.4.0, because nobody ran `npm publish`. A tag is harder to forget than
# a step in someone's head.
#
# To cut a release:
#   1. bump `version` in packages/shared/package.json, land it on master
#   2. git tag shared-v0.6.0 && git push origin shared-v0.6.0
#
# The tag is the trigger AND the assertion — step "Assert the tag matches the
# package version" fails the run if they disagree, so a mistyped tag can't
# publish the wrong version.

on:
  push:
    tags:
      # Namespaced by package so a second publishable workspace can get its own
      # tag prefix later without this workflow firing on it.
      - 'shared-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every check and pack the tarball, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  # Required for npm trusted publishing: npm exchanges this short-lived OIDC
  # token for publish rights. Nothing here reads a stored NPM_TOKEN — see the
  # publish step for the one-time npmjs.com setup that makes it work.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  # Deliberately NOT cancel-in-progress, unlike ci.yml. Cancelling a run
  # mid-publish can leave a version half-claimed on the registry, and npm
  # versions are immutable — you cannot re-publish over the wreckage.
  cancel-in-progress: false

jobs:
  publish:
    name: publish @antiphony/shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org


      # Install the npm this repo is verified against, read from the
      # `packageManager` field so there is exactly one place to bump it.
      #
      # `actions/setup-node` does NOT honour that field — corepack-aware tools
      # do, and it is not one — so this workflow silently verified on whatever
      # npm ships with the pinned Node instead: 10.9.8, a MAJOR behind the
      # 12.0.2 the repo declares and the Cloudflare build resolved. The two are
      # not interchangeable:
      #
      #   - npm 12 honours `allowScripts` and npm 10 ignores it, so the two
      #     install DIFFERENT trees from the same lockfile. That is the sharp
      #     end: this workflow is what says the tree is good.
      #   - npm 10 rewrites package-lock.json on install, dropping the `libc`
      #     fields npm 12 writes — so a contributor on 10 produces lockfile
      #     churn that reads as a real change.
      #
      # Verifying on one npm and shipping from another is what made "identical
      # config both passed and failed" something anyone had to reason about.
      - name: Use the pinned npm
        run: |
          set -euo pipefail
          # Strip any `+sha…` integrity suffix; `npm install -g` wants a plain spec.
          PM="$(node -p "require('./package.json').packageManager.split('+')[0]")"
          echo "package.json pins ${PM}; npm is now $(npm --version)"
          npm install --global "${PM}"
          npm --version

      # Installs on the pinned npm, and therefore on the same tree ci.yml
      # verified. This used to install on Node 22's own npm 10 and upgrade to 12
      # only just before the publish, because npm 12 does not run a dependency's
      # install script unless `allowScripts` covers it — and upgrading before
      # `npm ci` silently changed what got installed. The first run of this
      # workflow did exactly that and failed: ffmpeg-static never fetched its
      # binary and esbuild's postinstall was blocked, which would have taken out
      # `npm run build` immediately after.
      #
      # That ordering was the right call THEN and is the wrong one now. It was
      # protecting against an `allowScripts` list that did not yet cover what
      # this repo depends on. It does: esbuild and sharp are both listed, and
      # ffmpeg-static left the tree entirely when trim and waveform moved to
      # apps/audio-rendition. Keeping the split would mean the one workflow that
      # publishes something immutable is also the one verifying against a tree
      # no other workflow builds.
      #
      # Also builds @antiphony/shared through its `prepare` script — load-bearing
      # for the typecheck below, same as in ci.yml.
      - run: npm ci

      # Re-run the full gate rather than trusting that CI passed on the commit
      # this tag points at. A tag can be moved, or pushed to a commit that never
      # opened a PR; the registry is immutable, so verify here too.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      # The docs build and OpenAPI drift assertions from ci.yml are omitted on
      # purpose: they gate core-api's committed contract, which has no bearing
      # on the contents of this tarball (`files: ["dist"]`).

      - name: Assert the tag matches the package version
        if: github.event_name == 'push'
        run: |
          PKG_VERSION="$(node -p "require('./packages/shared/package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#shared-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} implies ${TAG_VERSION}, but packages/shared/package.json says ${PKG_VERSION}."
            echo "Bump the package version and move the tag, or tag shared-v${PKG_VERSION} instead."
            exit 1
          fi
          echo "Tag and package agree on ${PKG_VERSION}."

      # npm's own error for this is a bare 403 that reads like an auth failure.
      # Catching it here costs one request and says what actually happened.
      #
      # On a dry run this warns instead of failing. A dry run's job is to
      # exercise the pipeline, and the common case for running one — validating
      # the workflow itself against the current tree — is precisely when the
      # version is already published. Failing there would leave no way to get a
      # green run without cutting a real release.
      - name: Assert this version is not already published
        run: |
          PKG_VERSION="$(node -p "require('./packages/shared/package.json').version")"
          if npm view "@antiphony/shared@${PKG_VERSION}" version >/dev/null 2>&1; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "::warning::@antiphony/shared@${PKG_VERSION} is already on the registry. A real release would stop here."
            else
              echo "::error::@antiphony/shared@${PKG_VERSION} is already on the registry. npm versions are immutable — bump the version."
              exit 1
            fi
          else
            echo "@antiphony/shared@${PKG_VERSION} is unclaimed."
          fi

      - name: Pack (dry run)
        if: inputs.dry_run
        run: npm pack -w @antiphony/shared --dry-run

      # Trusted publishing needs npm >= 11.5.1; the pinned 12.0.2 installed at
      # the top of this job satisfies it. There used to be an `npm install -g
      # npm@12` step HERE instead, deliberately after the whole gate — see the
      # note on `npm ci` above for why that was right at the time and why it is
      # not any more.
      #
      # What that step's comment established and this still relies on: npm 11
      # warns about a package missing from `allowScripts` and still runs its
      # script, npm 12 blocks it. npm 11 was the runway; npm 12 is the
      # enforcement. Verified against both majors with a probe package.
      #
      # Nothing is installed past this point regardless, so the blocking default
      # has nothing to block — `npm publish` runs this repo's own
      # prepack/prepare, not a dependency's install script.

      # No NODE_AUTH_TOKEN, by design. This authenticates via the OIDC token
      # granted by `id-token: write` above, which requires a one-time setup on
      # npmjs.com: package settings -> Trusted Publisher -> GitHub Actions, with
      # this repo and the workflow filename `release.yml`. That filename is part
      # of the trust policy — renaming this file breaks publishing until the
      # policy is updated to match.
      #
      # Trusted publishing also attaches build provenance automatically, so the
      # registry can attest the tarball came from this workflow at this commit.
      #
      # If you ever need to fall back to a classic token, add
      #   env: { NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} }
      # to this step — but prefer fixing the trust policy. A stored token is a
      # long-lived credential that can publish from anywhere.
      #
      # The dist-tag is derived, not hardcoded: npm tags every publish `latest`
      # unless told otherwise, so tagging shared-v0.6.0-rc.1 would hand every
      # `npm install @antiphony/shared` a release candidate. A version carrying
      # a prerelease identifier goes to `next` instead.
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: |
          PKG_VERSION="$(node -p "require('./packages/shared/package.json').version")"
          case "$PKG_VERSION" in
            *-*) DIST_TAG=next ;;
            *)   DIST_TAG=latest ;;
          esac
          echo "Publishing ${PKG_VERSION} under dist-tag ${DIST_TAG}."
          npm publish -w @antiphony/shared --tag "$DIST_TAG"

      - name: Summary
        run: |
          PKG_VERSION="$(node -p "require('./packages/shared/package.json').version")"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "### Dry run: @antiphony/shared@${PKG_VERSION} validated, not published" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Published @antiphony/shared@${PKG_VERSION}" >> "$GITHUB_STEP_SUMMARY"
            echo "https://www.npmjs.com/package/@antiphony/shared/v/${PKG_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          fi
