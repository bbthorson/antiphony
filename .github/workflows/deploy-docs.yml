name: Deploy docs

# Ships the docs site (apps/docs, built by Astro) to the `antiphony-docs`
# Worker, using the assets-only config at the repo root — see wrangler.jsonc.
#
# ── Why this exists: the deploy that never ran ────────────────────────────────
# This site used to deploy through **Cloudflare Workers Builds** — the
# dashboard's "Connect to Git" integration, which watches the repo and runs its
# own build. That path is invisible from here, and on 2026-08-19 it showed why
# that matters: PR #111 corrected the docs to the Workers/Neon stack, CI passed,
# the PR merged — and docs.antiphony.dev went on serving the Firebase content
# for a full day. The newest deployment was still 2026-08-18T11:13Z. Nothing
# failed loudly, because nothing in this repo was running the deploy at all.
#
# That failure is not fixable from inside a dashboard-owned build. It is the
# same argument the core-api deploy already makes about its smoke test: a step
# that cannot report failure is worse than no step, because its silence is read
# as success. So the deploy moves here, where a failure is a red check on a
# commit, next to the CI that gated it.
#
# It also settles the class of bug that made #111 necessary. Workers Builds
# validates the dashboard's Worker name against `name` in the wrangler config
# and fails the build when they disagree — a coupling to a value nobody in the
# repo can see. `wrangler deploy` run from here uses the config as the single
# source of truth.
#
# ── REQUIRED one-time step, or this deploys twice ─────────────────────────────
# Disconnecting Workers Builds is a DASHBOARD action and cannot be done from a
# workflow file. Until someone does it, both paths deploy the same Worker and
# the last writer wins — which is exactly the nondeterminism this removes.
#
#   Workers & Pages -> antiphony-docs -> Settings -> Build
#     -> Disconnect the Git repository
#
# ── Credentials ──────────────────────────────────────────────────────────────
# The same pair the core-api deploy uses: `CLOUDFLARE_API_TOKEN` (repo secret,
# Workers Scripts:Edit) and `CLOUDFLARE_ACCOUNT_ID` (repo variable — an
# identifier, not a credential).

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-docs
    cancel-in-progress: false

jobs:
    # Does this commit change anything the docs site is built from?
    #
    # `workflow_run` has no `paths`, so the filter has to be a job. Plain git
    # rather than a third-party paths-filter action, to keep the dependency
    # surface of a DEPLOY workflow as small as possible.
    #
    # ⚠️ `apps/core-api/openapi.json` IS A DOCS BUILD INPUT, AND THAT IS THE
    # WHOLE REASON THIS FILTER NEEDED CARE.
    # `npm run build -w @antiphony/docs` runs `copy-openapi.mjs --strict`
    # first, which reads `apps/core-api/openapi.json` and FAILS the build if it
    # is missing. So the API reference the site serves is generated from a file
    # in ANOTHER app, and a filter of just `apps/docs/**` would publish a site
    # whose reference silently lagged core-api's committed spec.
    #
    # Only that one file, not `apps/core-api/**`: the spec is a committed
    # artefact and ci.yml regenerates it and fails on drift, so a schema change
    # that matters is always accompanied by a change to this file. Filtering on
    # the artefact is both narrower and more truthful than filtering on its
    # source.
    #
    # This is exactly the class of coupling `deploy.yml`'s header warns about
    # when it argues against reconstructing a path filter. The difference is
    # that here it was findable — the build script says what it reads — so the
    # filter is written from evidence rather than from memory.
    changes:
        # Only deploy a GREEN master. `workflow_run` fires on completion
        # regardless of outcome, so the conclusion is checked rather than
        # assumed. `workflow_dispatch` carries no `workflow_run` context and
        # falls through the empty-string comparison.
        if: >-
            github.event_name == 'workflow_dispatch' ||
            github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            sha: ${{ steps.filter.outputs.sha }}
            build: ${{ steps.filter.outputs.build }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
                  # 2, not 0: the diff needs one parent and nothing more.
                  fetch-depth: 2

            - id: filter
              run: |
                  SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
                  echo "sha=$SHA" >> "$GITHUB_OUTPUT"

                  # Diff against the first parent — for the merge commits that
                  # land on master, that is master-before-the-merge, so the diff
                  # is the whole change that just landed.
                  #
                  # A manual dispatch, or a commit whose parent we cannot reach,
                  # BUILDS: a redundant build is recoverable, a skipped one ships
                  # nothing while reporting success.
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
                     || ! git rev-parse -q --verify "$SHA^" >/dev/null; then
                      echo "No usable diff base — building."
                      echo "build=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  CHANGED=$(git diff --name-only "$SHA^" "$SHA")
                  echo "Changed files:"
                  echo "$CHANGED"

                  if echo "$CHANGED" | grep -qE '^(apps/docs/|apps/core-api/openapi\.json$|package(-lock)?\.json$|\.github/workflows/deploy-docs\.yml$)'; then
                      echo "build=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "build=false" >> "$GITHUB_OUTPUT"
                      echo "::notice::Nothing the docs site is built from changed — skipping."
                  fi

    deploy:
        needs: [changes]
        if: needs.changes.outputs.build == 'true'
        name: build · deploy
        runs-on: ubuntu-latest
        # Recorded as a deployment against the `production` environment, so
        # "what is live and since when" is answerable from the repo rather than from
        # a provider console. Deliberately carries NO protection rules: a required
        # reviewer here would pause a deploy waiting on the only person who could
        # approve it. It exists for the history, and as the scope that holds
        # environment-level secrets.
        environment:
            name: production
            url: https://docs.antiphony.dev
        # The "a red CI must not ship" check moved to the `changes` job this
        # job now needs — without it the trigger would be strictly worse than
        # the `push` it replaced, deploying on exactly the runs that failed. It
        # is not weakened by moving: a skipped `changes` skips this job too, and
        # keeping the condition in both places would mean two copies of one
        # rule, which is how they drift.
        steps:
            # The commit CI actually ran on. NOT `github.sha`: on a
            # `workflow_run` event that is the tip of the default branch when
            # this workflow was queued, which is a different commit the moment
            # anything merges while CI is in flight. Checking out the wrong one
            # would publish a tree nothing verified.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # The commit the `changes` job resolved, not a second
                  # derivation of it.
                  ref: ${{ needs.changes.outputs.sha }}

            - uses: ./.github/actions/setup-node

            - run: npm ci

            # `copy-openapi.mjs --strict` runs inside this build and fails it if
            # core-api's spec is missing, which ties the published API reference
            # to the contract CI just checked for drift.
            - name: Build the docs site
              run: npm run build -w @antiphony/docs

            # Reads the ROOT wrangler.jsonc: an assets-only Worker whose
            # `assets.directory` is ./apps/docs/dist, which the step above just
            # produced. core-api has its own config and is deployed by its own
            # workflow; a bare `wrangler deploy` here must keep finding this one
            # and nothing else.
            - name: Deploy
              run: npx wrangler deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

            # Asserts the deploy actually changed what the domain serves.
            #
            # A static site has no `/health` to stamp with a commit, so there is
            # no equivalent of core-api's SHA assertion. What there IS is the
            # specific failure this workflow was written for: the live site
            # serving the pre-migration stack. `wrangler dev` and `8787` appear
            # throughout the current quick start and Firebase appears in it only
            # in the past tense, so a page still describing emulators on port
            # 8090 is the stale-deploy signature.
            #
            # Deliberately a content check rather than a 200 check: the old page
            # returned 200 the whole time it was wrong.
            - name: Verify the published site is the current stack
              env:
                  QUICK_START: https://docs.antiphony.dev/self-hosting/quick-start/
              run: |
                  set -euo pipefail

                  # ── POLLED, because curl's --retry cannot help here ──────────
                  # This was a single fetch with `--retry 5 --retry-delay 5
                  # --retry-all-errors`, which retries on TRANSPORT failures —
                  # and the failure this step exists to catch is not one. A
                  # stale page returns 200 with the wrong content, so curl is
                  # satisfied on the first attempt, the content check fails, and
                  # the run goes red on a deploy that had merely not propagated.
                  # The note directly above already says the old page "returned
                  # 200 the whole time it was wrong"; the retry flags were
                  # answering a different question from the assertion.
                  #
                  # So: re-FETCH on stale content, over the same 20 x 6s window
                  # the other deploys in this repo use, and fail hard at the end.
                  for attempt in $(seq 1 20); do
                    PAGE="$(curl -fsS --max-time 20 "$QUICK_START" || true)"

                    if printf '%s' "$PAGE" | grep -q '8787' \
                       && ! printf '%s' "$PAGE" | grep -q 'firebase emulators:start'; then
                      echo "docs.antiphony.dev is serving the Workers/Postgres quick start."
                      exit 0
                    fi

                    if [ -z "$PAGE" ]; then
                      echo "attempt ${attempt}: no response yet"
                    else
                      echo "attempt ${attempt}: page served, but still looks like the previous build"
                    fi
                    sleep 6
                  done

                  echo "::error::docs.antiphony.dev quick start is not this build after 2 minutes."
                  echo "::error::Expected it to mention port 8787 and NOT to document 'firebase emulators:start'. A page that serves 200 with the old content is the stale-deploy signature — the deploy may have succeeded while the domain still serves the previous version."
                  exit 1
