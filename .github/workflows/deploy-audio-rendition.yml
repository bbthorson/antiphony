name: Deploy audio-rendition

# Ships apps/audio-rendition to Cloud Run.
#
# ── Why this one is a container and core-api is not ───────────────────────────
# It spawns `ffmpeg`, and no Workers runtime can spawn a subprocess. See
# specs/archive/cloudflare-migration.md § The ffmpeg problem for why one small container
# beat both Cloudflare Containers and ffmpeg.wasm.
#
# ── The flag that is a security control ───────────────────────────────────────
# `--max-instances` is what caps what a runaway or hostile caller can spend on
# ffmpeg. In the service this was adopted from it was load-bearing precisely
# because that service was PUBLIC. Here `/render` is system-authed, so the cap is
# a cost control rather than the primary defence — but it is still the only thing
# bounding a bug in core-api that dispatched in a loop, so do not drop it.
#
# ── One-time setup ────────────────────────────────────────────────────────────
# Reuses the Workload Identity Federation and Artifact Registry setup the
# core-api Cloud Run deploy used before it moved to Workers; see this file's
# git history if that has to be recreated.
#
# Secrets in Secret Manager, granted to the runtime service account:
#   system-auth-token         — the same shared secret core-api holds
#   r2-access-key-id          — R2 S3 API key
#   r2-secret-access-key      — R2 S3 API secret
#
# `R2_ACCOUNT_ID` is a repo variable: an account identifier, not a credential.
#
# ── Why the revision runs as antiphony-core-api@ ──────────────────────────────
# Without `--service-account`, Cloud Run runs revisions as the project's DEFAULT
# compute SA (`<num>-compute@developer.gserviceaccount.com`), which is not an
# accessor on any of the three secrets below. The deploy therefore built a good
# image and then failed at revision creation with `Permission denied on secret`
# (2026-08-17, twice).
#
# Fixed by naming the identity rather than widening the default one:
# `antiphony-core-api@` already holds `secretAccessor` on `system-auth-token` and
# is the identity that owns this platform's data, so the alternative — granting
# the shared default compute SA read on three secrets, two of which are R2
# write credentials — would have bought the same deploy at a permanently larger
# blast radius.
#
# The two R2 secrets must also EXIST; they did not until they were created by
# hand from a Cloudflare R2 API token. A missing secret fails the same way a
# permission gap does, so check both when this step errors.

# ── Why `workflow_run` and not `push` ─────────────────────────────────────────
# Same reason as .github/workflows/deploy.yml, and the same fix: on `push` this
# raced CI rather than following it, so a commit whose tests fail still shipped.
# CI builds this exact Dockerfile (`docker build -f apps/audio-rendition/
# Dockerfile .`), which is the check that matters here — the image is where this
# service's real preconditions live, including the `ffmpeg -version` assert.
# Racing it meant the one gate that could catch a broken image did not have to
# finish first.
#
# The path filter goes with the trigger; `workflow_run` has none. Deploying on
# every green master commit costs a rebuild of an identical image and removes
# the failure the filter could cause — a load-bearing but unlisted input
# changing, and this never running.
on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

concurrency:
    group: deploy-audio-rendition
    cancel-in-progress: false

env:
    PROJECT_ID: antiphony-core
    REGION: us-east4
    REPOSITORY: antiphony
    SERVICE: antiphony-audio-rendition
    # NOTE: DEPLOY_SHA is deliberately NOT here. It now reads the `changes`
    # job's output, and the `needs` context is NOT available in a
    # workflow-level `env:` — it would render as an empty string, tag the image
    # `…/audio-rendition:` and fail somewhere far from the cause. It is declared
    # on the `deploy` job instead, where `needs` resolves.

jobs:
    # Does this commit change anything audio-rendition is built from?
    #
    # `workflow_run` has no `paths`, so the filter has to be a job. Plain git
    # rather than a third-party paths-filter action, to keep the dependency
    # surface of a DEPLOY workflow as small as possible.
    #
    # ⚠️ THE PATTERN IS EXACTLY WHAT THE DOCKERFILE COPIES, AND NOTHING MORE.
    # Verified against it rather than guessed: the build stage copies
    # `package.json package-lock.json`, `apps/audio-rendition/package.json`,
    # and then `apps/audio-rendition` whole. It copies NO `packages/**` and no
    # other app, so this service genuinely cannot be affected by a change
    # outside those paths — which is what makes filtering safe here rather than
    # a guess about coupling.
    #
    # This is the workflow the review named: it rebuilt and pushed a container
    # to Artifact Registry on EVERY green master commit, docs-only merges
    # included — minutes of build plus a registry write to produce a
    # byte-identical image nobody asked for.
    #
    # The cost of skipping is that `/health` keeps reporting an older commit.
    # That is CORRECT here, not drift: the service was not rebuilt because
    # nothing it is built from changed. `deploy.yml` reasons the other way for
    # core-api and is right to — see the note there.
    changes:
        # Only deploy a GREEN master. `workflow_run` fires on completion
        # regardless of outcome, so the conclusion is checked rather than
        # assumed. `workflow_dispatch` carries no `workflow_run` context and
        # falls through the empty-string comparison.
        if: >-
            github.event_name == 'workflow_dispatch' ||
            github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            sha: ${{ steps.filter.outputs.sha }}
            build: ${{ steps.filter.outputs.build }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
                  # 2, not 0: the diff needs one parent and nothing more.
                  fetch-depth: 2

            - id: filter
              run: |
                  SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
                  echo "sha=$SHA" >> "$GITHUB_OUTPUT"

                  # Diff against the first parent — for the merge commits that
                  # land on master, that is master-before-the-merge, so the diff
                  # is the whole change that just landed.
                  #
                  # A manual dispatch, or a commit whose parent we cannot reach,
                  # BUILDS: a redundant build is recoverable, a skipped one ships
                  # nothing while reporting success.
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
                     || ! git rev-parse -q --verify "$SHA^" >/dev/null; then
                      echo "No usable diff base — building."
                      echo "build=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  CHANGED=$(git diff --name-only "$SHA^" "$SHA")
                  echo "Changed files:"
                  echo "$CHANGED"

                  if echo "$CHANGED" | grep -qE '^(apps/audio-rendition/|package(-lock)?\\.json$|\\.github/workflows/deploy-audio-rendition\\.yml$)'; then
                      echo "build=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "build=false" >> "$GITHUB_OUTPUT"
                      echo "::notice::Nothing audio-rendition is built from changed — skipping."
                  fi

    deploy:
        needs: [changes]
        if: needs.changes.outputs.build == 'true'
        name: build · deploy · smoke
        runs-on: ubuntu-latest
        env:
            # The commit CI ran on, resolved once by the `changes` job so the
            # filter, the checkout, the image tag, the COMMIT_SHA env var and the
            # smoke-test assertion all name one thing. NOT `github.sha`, which on
            # a `workflow_run` event is the tip of the default branch at queue
            # time — tagging an image with a SHA whose tree it was not built from
            # is the kind of wrong that only surfaces when someone tries to trace
            # a running revision back to a commit.
            DEPLOY_SHA: ${{ needs.changes.outputs.sha }}
        # Recorded as a deployment against the `production` environment, so
        # "what is live and since when" is answerable from the repo rather than from
        # a provider console. Deliberately carries NO protection rules: a required
        # reviewer here would pause a deploy waiting on the only person who could
        # approve it. It exists for the history, and as the scope that holds
        # environment-level secrets.
        environment:
            name: production
        # The "a red CI must not ship" check moved to the `changes` job this
        # job now needs. Not weakened by moving: a skipped `changes` skips this
        # job too, so a failed CI still cannot reach a deploy — and keeping the
        # condition in both places would mean two copies of one rule, which is
        # how they drift.
        steps:
            # The commit CI ran on — NOT `github.sha`, which on a `workflow_run`
            # event is the tip of the default branch when this run was queued.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # The commit the `changes` job resolved, not a second
                  # derivation of it.
                  ref: ${{ needs.changes.outputs.sha }}

            - id: auth
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
              with:
                  workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

            - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

            - name: Configure Docker for Artifact Registry
              run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

            # Tagged by commit sha, not `latest`. The sha tag is what makes a
            # rollback a one-liner against a known image, and what the smoke test
            # asserts the running revision reports.
            #
            # The Dockerfile asserts ffmpeg landed in the image (`ffmpeg
            # -version` during build), so a broken base image fails here rather
            # than 502-ing on some cache miss weeks later.
            - name: Build and push
              id: build
              run: |
                  IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/audio-rendition"
                  docker build \
                    -f apps/audio-rendition/Dockerfile \
                    --tag "${IMAGE}:${DEPLOY_SHA}" \
                    .
                  docker push "${IMAGE}:${DEPLOY_SHA}"
                  echo "image=${IMAGE}:${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"

            # Sizing notes, all deliberate:
            #   --memory 1Gi        one blob in, one mp3 out, both in memory, and
            #                       the upload route caps a blob at 25MB. 512Mi
            #                       would probably do; 1Gi costs nothing at this
            #                       volume and an OOM here is a caller hearing
            #                       silence.
            #   --timeout 120       a transcode of a voicemail-length clip is
            #                       seconds. The caller's own budget is shorter
            #                       than this, so a longer timeout would only
            #                       hold a connection nobody is waiting on.
            #   --max-instances 4   the abuse/runaway cap. See the note above.
            #   --no-allow-unauthenticated is NOT set: core-api reaches this over
            #                       the public URL with a bearer, the same shape
            #                       every other /system/* caller uses. Moving to
            #                       IAM invoker identity is the better mechanism
            #                       and is the same coordinated change
            #                       core-api's system-auth middleware names as
            #                       its own swap point.
            # The build time as a step OUTPUT rather than inline in the deploy
            # command, so the smoke test can assert the exact value this run
            # stamped. Inline, nothing downstream could see it — which is why
            # the smoke test could only ever check the sha.
            - name: Stamp the build time
              id: stamp
              run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

            - name: Deploy
              id: deploy
              run: |
                  gcloud run deploy "${SERVICE}" \
                    --project "${PROJECT_ID}" \
                    --region "${REGION}" \
                    --image "${{ steps.build.outputs.image }}" \
                    --platform managed \
                    --allow-unauthenticated \
                    --service-account antiphony-core-api@antiphony-core.iam.gserviceaccount.com \
                    --memory 1Gi \
                    --timeout 120 \
                    --max-instances 4 \
                    --set-env-vars "NODE_ENV=production,LOG_LEVEL=info,ANTIPHONY_R2_BUCKET=antiphony-r2-bucket,R2_ACCOUNT_ID=${{ vars.R2_ACCOUNT_ID }},COMMIT_SHA=${DEPLOY_SHA},BUILD_TIME=${{ steps.stamp.outputs.time }}" \
                    --set-secrets "SYSTEM_AUTH_TOKEN=system-auth-token:latest,R2_ACCESS_KEY_ID=r2-access-key-id:latest,R2_SECRET_ACCESS_KEY=r2-secret-access-key:latest" \
                    --quiet
                  URL="$(gcloud run services describe "${SERVICE}" \
                    --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.url)')"
                  echo "url=${URL}" >> "$GITHUB_OUTPUT"

            - name: Smoke test
              run: |
                  # /health only. A real transcode needs a source blob in R2 and
                  # a bearer, neither of which belongs in CI — and the thing most
                  # likely to be broken (a missing ffmpeg) is already asserted at
                  # image build time.
                  #
                  # What this catches is a revision that will not start, and it
                  # asserts the running sha so "is what I merged what is running"
                  # is answered rather than assumed.
                  # ── Two assertions, and a two-minute window ─────────────────
                  # `sha` proves the running revision was built from this
                  # commit; it does NOT prove THIS RUN deployed it. Re-run this
                  # workflow on a commit already live and the check passes
                  # instantly, satisfied by the previous deploy — so a re-run
                  # whose deploy silently did nothing reports success.
                  # `builtAt` comes from the BUILD_TIME stamped seconds ago, so
                  # matching it proves the live revision is this run's.
                  #
                  # This also stops matching the sha ANYWHERE in the body: the
                  # old `grep -q "${DEPLOY_SHA}"` would have been satisfied by
                  # the sha appearing in any other field. Both are matched as
                  # JSON fields now (`sha` and `builtAt`, which is what this
                  # service's /health actually calls them).
                  #
                  # 20 x 6s rather than 5 x 5s, so all three deploy workflows in
                  # this repo and the two in vox-pop agree on how long
                  # propagation is allowed to take. 25 seconds was not enough in
                  # vox-pop on 2026-09-04 and failed a deploy that had worked.
                  for attempt in $(seq 1 20); do
                    BODY="$(curl -fsS --max-time 10 "${{ steps.deploy.outputs.url }}/health" || true)"
                    echo "attempt ${attempt}: ${BODY}"
                    if printf '%s' "$BODY" | grep -q "\"sha\":\"${DEPLOY_SHA}\"" \
                       && printf '%s' "$BODY" | grep -q "\"builtAt\":\"${{ steps.stamp.outputs.time }}\""; then
                      echo "live revision is ${DEPLOY_SHA}, built at ${{ steps.stamp.outputs.time }} by this run"
                      exit 0
                    fi
                    sleep 6
                  done
                  echo "::error::/health did not report sha=${DEPLOY_SHA} builtAt=${{ steps.stamp.outputs.time }} after 2 minutes."
                  echo "::error::If sha matches but builtAt does not, the live revision is an EARLIER deploy of this same commit — this run's deploy did not take."
                  exit 1
